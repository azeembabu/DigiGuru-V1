# Digi Guru - Docker Compose
# PostgreSQL 16 for Phase 1 Database & Prisma Layer

services:
  postgres:
    image: postgres:16-alpine
    container_name: digi-guru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digiguru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiguru_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-digiguru_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digiguru} -d ${POSTGRES_DB:-digiguru_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - digi-guru-network

volumes:
  postgres_data:
    name: digi-guru-postgres-data
    driver: local

networks:
  digi-guru-network:
    name: digi-guru-network
    driver: bridge
