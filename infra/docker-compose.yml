version: "3.9"

# Local dev stack for Digi Guru — Postgres 16, Redis 7, Qdrant.
# Usage: docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: digiguru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digiguru
      POSTGRES_PASSWORD: digiguru_dev
      POSTGRES_DB: digiguru
    ports:
      - "5432:5432"
    volumes:
      - digiguru_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digiguru -d digiguru"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: digiguru-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - digiguru_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: digiguru-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - digiguru_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  digiguru_postgres_data:
    name: digiguru_postgres_data
  digiguru_redis_data:
    name: digiguru_redis_data
  digiguru_qdrant_data:
    name: digiguru_qdrant_data
