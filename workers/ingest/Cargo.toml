[package]
name = "ingest-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ingest-worker"
path = "src/main.rs"

# Unit cover images are rendered here, and pdfium is a native library this
# build does not vendor -- so the feature is off by default and the worker
# ingests exactly as before without it (`crates/rag/src/thumbnail.rs`).
[features]
default = []
pdfium = ["dg-rag/pdfium"]

[dependencies]
dg-core = { workspace = true }
dg-db = { workspace = true }
dg-rag = { workspace = true }

tokio = { workspace = true }
sqlx = { workspace = true }
qdrant-client = { workspace = true }
redis = { workspace = true }
uuid = { workspace = true }
# `anyhow` only in the binary (`.claude/rules/code-style.md`); the library
# crates it calls expose typed `thiserror` enums.
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
