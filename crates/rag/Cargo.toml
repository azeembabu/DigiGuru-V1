[package]
name = "dg-rag"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rag"
path = "src/lib.rs"

[dependencies]
# The Gemini embedding endpoint is plain REST, and reqwest is already in the
# tree via qdrant-client, so this adds no new transitive weight. `rustls-tls`
# rather than native-tls to stay on the one TLS stack the workspace already uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
dg-core = { workspace = true }
dg-db = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
sqlx = { workspace = true }
lopdf = { workspace = true }
qdrant-client = { workspace = true }
redis = { workspace = true }
sha2 = { workspace = true }

# First-page rasterisation for unit cover images (`src/thumbnail.rs`).
# Optional, and off by default: pdfium is a native C++ library this build does
# not vendor, so a tree that cannot supply it does not carry the dependency at
# all. With the feature off the renderer reports "no engine" and ingestion is
# unchanged -- the same posture `parse.rs` takes towards OCR.
pdfium-render = { version = "0.9", optional = true }
image = { version = "0.25", default-features = false, features = ["webp"], optional = true }

[features]
default = []
pdfium = ["dep:pdfium-render", "dep:image"]
