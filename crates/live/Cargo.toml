[package]
name = "dg-live"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "live"
path = "src/lib.rs"

[dependencies]
# Union of both Phase 3 passes: dg-core/tokio/async-trait/bytes are the Gemini
# client and turn FSM merged from main; uuid is the board-op schema validated
# by SyncGate. Nothing here is unused -- see lib.rs for why both live side by
# side.
dg-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# The assessment call (`assess.rs`) is plain REST `generateContent`, not the
# Live socket, so it needs an HTTP client. Same feature set as `dg-rag` uses
# for the embedding endpoint -- rustls rather than native-tls, so there is one
# TLS stack in the build.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# The real Gemini Live client (Phase 3). `tokio-tungstenite` pins the same
# 0.29 already in the lockfile via axum, and reuses the rustls stack sqlx
# already brings in -- deliberately not a second TLS implementation.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Live carries PCM16 audio and inline blobs as base64 on a JSON frame.
base64 = { workspace = true }
