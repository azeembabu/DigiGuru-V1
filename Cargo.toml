[workspace]
resolver = "2"
members = [
    "apps/gateway",
    "crates/core",
    "crates/db",
    "crates/rag",
    "crates/live",
    "crates/guardrails",
    "crates/quota",
    "workers/ingest",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
argon2 = "0.5"
validator = { version = "0.19", features = ["derive"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
dotenvy = "0.15"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
async-trait = "0.1"
bytes = "1"
lopdf = "0.32"
qdrant-client = "1"

dg-core = { path = "crates/core" }
dg-db = { path = "crates/db" }
dg-rag = { path = "crates/rag" }
dg-live = { path = "crates/live" }
dg-guardrails = { path = "crates/guardrails" }
dg-quota = { path = "crates/quota" }
