[workspace]
resolver = "2"
members = [
    "apps/gateway",
    "crates/core",
    "crates/db",
    "crates/rag",
    "crates/live",
    "crates/guardrails",
    "crates/quota",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
argon2 = "0.5"

dg-core = { path = "crates/core" }
dg-db = { path = "crates/db" }
dg-rag = { path = "crates/rag" }
dg-live = { path = "crates/live" }
dg-guardrails = { path = "crates/guardrails" }
dg-quota = { path = "crates/quota" }
