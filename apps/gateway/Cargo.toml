[package]
name = "gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# Without this, adding the `create_admin` bootstrap binary made the documented
# `cargo run -p gateway` ambiguous and it stopped working. The server is the
# default; the bootstrap CLI is opt-in via `--bin create_admin`.
default-run = "gateway"

[[bin]]
name = "gateway"
path = "src/main.rs"

# First-super-admin bootstrap. A binary rather than a route precisely so it
# cannot be reached over the network — see the module doc comment.
[[bin]]
name = "create_admin"
path = "src/bin/create_admin.rs"

[dependencies]
dg-core = { workspace = true }
dg-db = { workspace = true }
dg-live = { workspace = true }
# Read-only access to the NN-3 daily voice ledger for the student dashboard's
# quota ring. The gateway reads the ledger here (`QuotaStore::get_ms`) and
# never charges it: only the socket task that owns a live session may do that.
dg-quota = { workspace = true }

# The `seed_dev` dev-only seeder writes rows directly with compile-time checked
# `sqlx::query!` macros; the gateway proper goes through `dg-db`.
sqlx = { workspace = true }

tokio = { workspace = true }
# `ws` enables axum's built-in WebSocket upgrade extractor/`Message` type,
# used by `src/ws` (Phase 3, `.claude/rules/api-conventions.md` "WebSocket").
axum = { workspace = true, features = ["ws"] }
axum-extra = { workspace = true }
bytes = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }

jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
validator = { workspace = true }

redis = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
dotenvy = { workspace = true }

rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
time = "0.3"
# No-echo password prompt for the `create_admin` bootstrap binary. Added so
# the first admin password is never a command-line argument (shell history)
# and never echoed to the terminal; `rpassword` is the standard minimal
# crate for exactly that and pulls in no runtime.
rpassword = "7"

# Bulk question-pool import formats (`.claude/rules/api-conventions.md`,
# "Bulk import"). Each is here for exactly one parser and nothing else:
# `calamine` reads the `.xlsx` worksheet (pure-Rust, no native Excel
# dependency); `zip` opens the `.docx` OOXML container; `quick-xml` pulls the
# one table out of `word/document.xml`. Writing an xlsx shared-strings reader
# by hand was the alternative and is a silent-misparse risk on an answer key.
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the router in `me::tests` without a
# live listener or an `AppState`.
tower = { workspace = true, features = ["util"] }
